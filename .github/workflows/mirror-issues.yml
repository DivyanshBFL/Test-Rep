name: Mirror Issues from Client Repo

on:
  workflow_dispatch:

# Prevent overlapping runs in the same repository.
concurrency:
  group: mirror-client-issues-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch and Mirror Issues
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          CLIENT_REPOS=(
            "Snapporg/frontend"
            "Snapporg/mobile-app"
            "Snapporg/wheelhouse-mobile"
          )

          # Fetch all existing target issues, including closed issues.
          EXISTING_ISSUES=$(gh api --paginate \
            "repos/${TARGET_REPO}/issues?state=all&per_page=100" |
            jq -s 'add | map(
              select(has("pull_request") | not) |
              {number, title, body}
            )')

          for SOURCE_REPO in "${CLIENT_REPOS[@]}"; do
            echo "Scanning $SOURCE_REPO..."

            # Fetch all open issues, excluding pull requests.
            CLIENT_ISSUES=$(gh api --paginate \
              "repos/${SOURCE_REPO}/issues?state=open&per_page=100" |
              jq -s 'add | map(
                select(has("pull_request") | not) |
                {
                  number,
                  title,
                  body,
                  author: {login: (.user.login // "Unknown")},
                  createdAt: .created_at,
                  labels,
                  state: (.state | ascii_upcase)
                }
              )')

            if [ -z "$CLIENT_ISSUES" ] || [ "$CLIENT_ISSUES" = "[]" ]; then
              echo "No open issues found in $SOURCE_REPO."
              continue
            fi

            REPO_NAME=$(basename "$SOURCE_REPO")

            readarray -t ISSUES_ARRAY < <(
              echo "$CLIENT_ISSUES" | jq -c '.[]'
            )

            for issue in "${ISSUES_ARRAY[@]}"; do
              CLIENT_NUM=$(echo "$issue" | jq -r '.number')
              CLIENT_TITLE=$(echo "$issue" | jq -r '.title')
              CLIENT_AUTHOR=$(echo "$issue" | jq -r '.author.login // "Unknown"')
              CLIENT_CREATED=$(echo "$issue" | jq -r '.createdAt // "Unknown"')
              CLIENT_STATE=$(echo "$issue" | jq -r '.state // "OPEN"')

              CLIENT_LABELS=$(echo "$issue" |
                jq -r '[.labels[].name] | join(", ")')

              if [ -z "$CLIENT_LABELS" ]; then
                CLIENT_LABELS="None"
              fi

              DEDUP_TOKEN="DEDUP_${REPO_NAME}_${CLIENT_NUM}"

              # Detect current markers and legacy metadata.
              MATCH_COUNT=$(echo "$EXISTING_ISSUES" |
                jq --arg token "$DEDUP_TOKEN" \
                   --arg repo "$REPO_NAME" \
                   --arg num "$CLIENT_NUM" '
                  [
                    .[] |
                    select(
                      (.body // "") |
                      split("\n") as $lines |
                      (
                        ($lines | any(. == ("Token: " + $token)))
                        or
                        (
                          ($lines | any(. == ("OrigRepo: " + $repo)))
                          and
                          ($lines | any(. == ("OrigNumber: " + $num)))
                        )
                      )
                    )
                  ] | length
                ')

              if [ "$MATCH_COUNT" -gt 0 ]; then
                echo "Already mirrored: $REPO_NAME #$CLIENT_NUM. Skipping."
                continue
              fi

              echo "Mirroring [$REPO_NAME #$CLIENT_NUM]: $CLIENT_TITLE"

              TEMP_FILE=$(mktemp)

              cat <<EOF > "$TEMP_FILE"
          ---CLIENT_META---
          Token: ${DEDUP_TOKEN}
          OrigRepo: ${REPO_NAME}
          OrigNumber: ${CLIENT_NUM}
          OrigAuthor: ${CLIENT_AUTHOR}
          OrigCreatedAt: ${CLIENT_CREATED}
          OrigLabels: ${CLIENT_LABELS}
          OrigState: ${CLIENT_STATE}
          ---END_CLIENT_META---

          EOF

              echo "$issue" |
                jq -r '.body // "No description provided."' >> "$TEMP_FILE"

              if gh issue create \
                --repo "$TARGET_REPO" \
                --title "$CLIENT_TITLE" \
                --body-file "$TEMP_FILE"; then

                # Prevent duplicate processing within this run.
                EXISTING_ISSUES=$(echo "$EXISTING_ISSUES" |
                  jq --arg body "$(cat "$TEMP_FILE")" \
                    '. + [{"number": null, "title": null, "body": $body}]')

                echo "Successfully mirrored $REPO_NAME #$CLIENT_NUM."
              else
                rm -f "$TEMP_FILE"
                echo "ERROR: Failed to mirror $REPO_NAME #$CLIENT_NUM." >&2
                exit 1
              fi

              rm -f "$TEMP_FILE"
            done
          done
