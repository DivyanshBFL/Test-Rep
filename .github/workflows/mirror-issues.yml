name: Mirror Issues from Client Repo

on:
  schedule:
    # Runs every 10 minutes at off-peak minute marks to avoid GitHub queue congestion
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Mirror Issues
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          CLIENT_REPOS=(
            "Snapporg/frontend"
            "Snapporg/mobile-app"
            "Snapporg/wheelhouse-mobile"
          )

          # Fetch all existing issue bodies to prevent duplicates
          EXISTING_BODIES=$(gh issue list --repo "$TARGET_REPO" --state all --limit 500 --json body --jq '.[].body' 2>/dev/null || true)

          for SOURCE_REPO in "${CLIENT_REPOS[@]}"; do
            echo "Scanning $SOURCE_REPO..."

            # Limit to 2 most recent open issues for testing (switch to 100 for production)
            CLIENT_ISSUES=$(gh issue list --repo "$SOURCE_REPO" --state open --limit 2 --json number,title,body,author,createdAt,labels,state 2>/dev/null || echo "[]")

            if [ -z "$CLIENT_ISSUES" ] || [ "$CLIENT_ISSUES" = "[]" ]; then
              echo "No issues found in $SOURCE_REPO."
              continue
            fi

            REPO_NAME=$(basename "$SOURCE_REPO")

            echo "$CLIENT_ISSUES" | jq -c '.[]' | while read -r issue; do
              CLIENT_NUM=$(echo "$issue" | jq -r '.number')
              CLIENT_TITLE=$(echo "$issue" | jq -r '.title')
              CLIENT_AUTHOR=$(echo "$issue" | jq -r '.author.login // "Unknown"')
              CLIENT_CREATED=$(echo "$issue" | jq -r '.createdAt // empty')
              CLIENT_STATE=$(echo "$issue" | jq -r '.state // "OPEN"')

              CLIENT_LABELS=$(echo "$issue" | jq -r '[.labels[].name] | join(", ")')
              if [ -z "$CLIENT_LABELS" ]; then
                CLIENT_LABELS="None"
              fi

              if [ -z "$CLIENT_CREATED" ]; then
                CLIENT_CREATED=$(echo "$issue" | jq -r '.created_at // "Unknown"')
              fi

              # Single-line dedup key matches exactly what is written into the body
              DEDUP_TAG="DEDUP_KEY: [${REPO_NAME}#${CLIENT_NUM}]"

              if echo "$EXISTING_BODIES" | grep -Fq "$DEDUP_TAG"; then
                echo "Issue [$REPO_NAME #$CLIENT_NUM] already mirrored. Skipping."
              else
                echo "Mirroring [$REPO_NAME #$CLIENT_NUM]: $CLIENT_TITLE"

                # Write metadata cleanly including the exact DEDUP_TAG
                echo "---CLIENT_META---" > /tmp/issue_meta.txt
                echo "${DEDUP_TAG}" >> /tmp/issue_meta.txt
                echo "OrigRepo: ${REPO_NAME}" >> /tmp/issue_meta.txt
                echo "OrigNumber: ${CLIENT_NUM}" >> /tmp/issue_meta.txt
                echo "OrigAuthor: ${CLIENT_AUTHOR}" >> /tmp/issue_meta.txt
                echo "OrigCreatedAt: ${CLIENT_CREATED}" >> /tmp/issue_meta.txt
                echo "OrigLabels: ${CLIENT_LABELS}" >> /tmp/issue_meta.txt
                echo "OrigState: ${CLIENT_STATE}" >> /tmp/issue_meta.txt
                echo "---END_CLIENT_META---" >> /tmp/issue_meta.txt
                echo "" >> /tmp/issue_meta.txt

                # Append issue body
                echo "$issue" | jq -r '.body // "No description provided."' >> /tmp/issue_meta.txt

                # Create issue in personal repository
                gh issue create \
                  --repo "$TARGET_REPO" \
                  --title "$CLIENT_TITLE" \
                  --body-file /tmp/issue_meta.txt

                # Update local memory cache immediately for this run
                EXISTING_BODIES="${EXISTING_BODIES} ${DEDUP_TAG}"

                rm -f /tmp/issue_meta.txt
              fi
            done
          done
