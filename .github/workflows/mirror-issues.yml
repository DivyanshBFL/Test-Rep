name: Mirror Issues from Client Repo

on:
  schedule:
    # Runs every 15 minutes in GitHub Cloud
    - cron: '*/15 * * * *'
  # Allows you to click "Run workflow" manually to test anytime
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Mirror Issues
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SOURCE_REPO: "Snapporg/mobile-app"
          TARGET_REPO: "${{ github.repository }}"
        run: |
          echo "Checking for open issues in $SOURCE_REPO..."
          
          # Fetch open issues from the client repo (JSON format, up to 30 recent issues)
          CLIENT_ISSUES=$(gh issue list --repo "$SOURCE_REPO" --state open --limit 30 --json number,title,body)
          
          # Fetch issue titles already present in the target personal repo to prevent duplicates
          EXISTING_TITLES=$(gh issue list --repo "$TARGET_REPO" --state all --limit 100 --json title --jq '.[].title')
          
          # Loop through each issue found in the client repo
          echo "$CLIENT_ISSUES" | jq -c '.[]' | while read -r issue; do
            CLIENT_NUM=$(echo "$issue" | jq -r '.number')
            CLIENT_TITLE=$(echo "$issue" | jq -r '.title')
            CLIENT_BODY=$(echo "$issue" | jq -r '.body // "No description provided."')
            
            # Format title with client issue number for clarity and exact tracking
            FORMATTED_TITLE="[#${CLIENT_NUM}] ${CLIENT_TITLE}"
            
            # Check if an issue with this title already exists in your personal repo
            if echo "$EXISTING_TITLES" | grep -Fxq "$FORMATTED_TITLE"; then
              echo "Issue $FORMATTED_TITLE already exists in target repository. Skipping."
            else
              echo "Creating new issue: $FORMATTED_TITLE"
              gh issue create \
                --repo "$TARGET_REPO" \
                --title "$FORMATTED_TITLE" \
                --body "$CLIENT_BODY"
            fi
          done
