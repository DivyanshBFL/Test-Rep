name: Mirror Issues from Client Repo

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Mirror Issues
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          CLIENT_REPOS=(
            "Snapporg/frontend"
            "Snapporg/mobile-app"
            "Snapporg/wheelhouse-mobile"
          )

          # Fetch existing issues from the target repository.
          # Check issue bodies directly instead of relying on search indexing.
          EXISTING_BODIES=$(gh issue list \
            --repo "$TARGET_REPO" \
            --state all \
            --limit 1000 \
            --json body \
            --jq '.[].body')

          for SOURCE_REPO in "${CLIENT_REPOS[@]}"; do
            echo "Scanning $SOURCE_REPO..."

            CLIENT_ISSUES=$(gh issue list \
              --repo "$SOURCE_REPO" \
              --state open \
              --limit 2 \
              --json number,title,body,author,createdAt,labels,state)

            if [ -z "$CLIENT_ISSUES" ] || [ "$CLIENT_ISSUES" = "[]" ]; then
              echo "No issues found in $SOURCE_REPO."
              continue
            fi

            REPO_NAME=$(basename "$SOURCE_REPO")

            readarray -t ISSUES_ARRAY < <(
              echo "$CLIENT_ISSUES" | jq -c '.[]'
            )

            for issue in "${ISSUES_ARRAY[@]}"; do
              CLIENT_NUM=$(echo "$issue" | jq -r '.number')
              CLIENT_TITLE=$(echo "$issue" | jq -r '.title')
              CLIENT_AUTHOR=$(echo "$issue" | jq -r '.author.login // "Unknown"')
              CLIENT_CREATED=$(echo "$issue" | jq -r '.createdAt // "Unknown"')
              CLIENT_STATE=$(echo "$issue" | jq -r '.state // "OPEN"')

              CLIENT_LABELS=$(echo "$issue" | jq -r '[.labels[].name] | join(", ")')
              if [ -z "$CLIENT_LABELS" ]; then
                CLIENT_LABELS="None"
              fi

              # Stable unique marker for each source issue.
              DEDUP_TOKEN="DEDUP_${REPO_NAME}_${CLIENT_NUM}"

              # Match the complete marker line in existing issue bodies.
              if printf '%s\n' "$EXISTING_BODIES" |
                grep -Fqx "Token: ${DEDUP_TOKEN}"; then
                echo "Issue [$REPO_NAME #$CLIENT_NUM] is already mirrored. Skipping."
                continue
              fi

              echo "Mirroring [$REPO_NAME #$CLIENT_NUM]: $CLIENT_TITLE"

              TEMP_FILE=$(mktemp)

              cat <<EOF > "$TEMP_FILE"
          ---CLIENT_META---
          Token: ${DEDUP_TOKEN}
          OrigRepo: ${REPO_NAME}
          OrigNumber: ${CLIENT_NUM}
          OrigAuthor: ${CLIENT_AUTHOR}
          OrigCreatedAt: ${CLIENT_CREATED}
          OrigLabels: ${CLIENT_LABELS}
          OrigState: ${CLIENT_STATE}
          ---END_CLIENT_META---

          EOF

              echo "$issue" |
                jq -r '.body // "No description provided."' >> "$TEMP_FILE"

              # Add the marker to the in-memory list only after successful creation.
              if gh issue create \
                --repo "$TARGET_REPO" \
                --title "$CLIENT_TITLE" \
                --body-file "$TEMP_FILE"; then

                EXISTING_BODIES="${EXISTING_BODIES}"$'\n'"Token: ${DEDUP_TOKEN}"
                echo "Successfully mirrored [$REPO_NAME #$CLIENT_NUM]."
              else
                echo "ERROR: Failed to mirror [$REPO_NAME #$CLIENT_NUM]." >&2
                rm -f "$TEMP_FILE"
                exit 1
              fi

              rm -f "$TEMP_FILE"
            done
          done
