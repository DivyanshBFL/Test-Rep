name: Mirror Issues from Client Repo

on:
  schedule:
    # Runs every 15 minutes automatically in GitHub Cloud
    - cron: '*/15 * * * *'
  # Allows manual triggering anytime via the "Run workflow" button
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Mirror Issues
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SOURCE_REPO: "Snapporg/mobile-app"
          TARGET_REPO: ${{ github.repository }}
        run: |
          echo "Connecting to $SOURCE_REPO..."

          # Fetch up to 100 open issues from the client repository
          CLIENT_ISSUES=$(gh issue list --repo "$SOURCE_REPO" --state open --limit 100 --json number,title,body)

          # Check if any issues exist
          if [ -z "$CLIENT_ISSUES" ] || [ "$CLIENT_ISSUES" = "[]" ]; then
            echo "No open issues found in $SOURCE_REPO."
            exit 0
          fi

          # Read issue titles already present in your target repo (up to 500) to prevent duplicates
          EXISTING_TITLES=$(gh issue list --repo "$TARGET_REPO" --state all --limit 500 --json title --jq '.[].title')

          # Iterate through each client issue and mirror if not already added
          echo "$CLIENT_ISSUES" | jq -c '.[]' | while read -r issue; do
            CLIENT_NUM=$(echo "$issue" | jq -r '.number')
            CLIENT_TITLE=$(echo "$issue" | jq -r '.title')
            CLIENT_BODY=$(echo "$issue" | jq -r '.body // "No description provided."')

            FORMATTED_TITLE="[#${CLIENT_NUM}] ${CLIENT_TITLE}"

            if echo "$EXISTING_TITLES" | grep -Fxq "$FORMATTED_TITLE"; then
              echo "Issue '$FORMATTED_TITLE' already exists in target repository. Skipping."
            else
              echo "Creating new issue: $FORMATTED_TITLE"
              gh issue create \
                --repo "$TARGET_REPO" \
                --title "$FORMATTED_TITLE" \
                --body "$CLIENT_BODY"
            fi
          done
